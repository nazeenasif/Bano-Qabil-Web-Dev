<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In / Sign Up</title>
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url("https://i0.wp.com/picjumbo.com/wp-content/uploads/nature-background-free-image.jpeg?w=2210&quality=70") center/cover no-repeat;
      z-index: -1;
      filter: brightness(0.7);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">

  <div id="mainBox" class="w-full max-w-md bg-white bg-opacity-90 shadow-lg rounded-2xl p-8 text-center">
    <h1 class="text-2xl font-bold mb-6">Welcome</h1>
    <button id="showSignin" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition mb-4">Sign In</button>
    <button id="showSignup" class="w-full bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition">Sign Up</button>
  </div>

  <!-- Sign In Form -->
  <div id="signinBox" class="w-full max-w-md bg-white bg-opacity-90 shadow-lg rounded-2xl p-8 hidden">
    <h2 class="text-xl font-bold mb-4">Sign In</h2>
    <form id="signinForm" class="space-y-4">
      <input type="email" id="signinEmail" placeholder="Email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      <input type="password" id="signinPassword" placeholder="Password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">Sign In</button>
    </form>
    <button id="back1" class="mt-4 text-blue-600 underline">⬅ Back</button>
    <p id="signinMessage" class="mt-3 text-sm font-semibold text-center"></p>
  </div>

  <!-- Sign Up Form -->
  <div id="signupBox" class="w-full max-w-md bg-white bg-opacity-90 shadow-lg rounded-2xl p-8 hidden">
    <h2 class="text-xl font-bold mb-4">Sign Up</h2>
    <form id="signupForm" class="space-y-4">
      <input type="text" id="signupName" placeholder="Full Name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"/>
      <input type="email" id="signupEmail" placeholder="Email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"/>
      <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"/>
      <button type="submit" class="w-full bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition">Sign Up</button>
    </form>
    <button id="back2" class="mt-4 text-green-600 underline">⬅ Back</button>
    <p id="signupMessage" class="mt-3 text-sm font-semibold text-center"></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
